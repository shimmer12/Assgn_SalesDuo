version: '3.8'

services:
  backend:
    build:
      context: ./backend_SalesDuo
      dockerfile: Dockerfile.dev  # ← Uses dev-specific Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend_SalesDuo:/app
      - /app/node_modules  # preserves container's node_modules
    environment:
      - DATABASE_URL=mysql://user:password@mysql:3306/salesduo
      - DB_HOST=mysql
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=salesduo
      - DB_DIALECT=mysql
      - PORT=5000
      - OPENAI_API_KEY=your-key-here
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend_SalesDuo
    ports:
      - "3000:3000"
    volumes:
      - ./frontend_SalesDuo:/app
      - /app/node_modules
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: mysql-server
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "RootPass123"
      MYSQL_DATABASE: "salesduo"
      MYSQL_USER: "user"
      MYSQL_PASSWORD: "password"
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"  # host:container — avoids local MySQL conflict
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--user=root", "--password=RootPass123"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data: